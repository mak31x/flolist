name: check

on:
  pull_request:
  # Pushes to main run this through deploy.yml, which deploys only if it passes.
  workflow_call:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

  # Critical flows in a real browser (D-014, D-020): API + web dev servers against Postgres
  # and Mailpit service containers on the dev ports (D-019).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:19.0-alpine
        env:
          POSTGRES_USER: flolist
          POSTGRES_PASSWORD: flolist
          POSTGRES_DB: flolist
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U flolist" --health-interval 2s --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.34.0
        ports: ["1026:1025", "8026:8025"]
      rustfs:
        image: rustfs/rustfs:1.0.6
        env:
          RUSTFS_ACCESS_KEY: flolist
          RUSTFS_SECRET_KEY: flolist-dev-secret
          RUSTFS_ADDRESS: ":9000"
          RUSTFS_CONSOLE_ENABLE: "false"
        ports: ["9010:9000"]
    env:
      DATABASE_URL: postgres://flolist:flolist@localhost:5433/flolist
      S3_ENDPOINT: http://localhost:9010
      S3_BUCKET: flolist
      S3_ACCESS_KEY: flolist
      S3_SECRET_KEY: flolist-dev-secret
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @flolist/e2e exec playwright install --with-deps chromium

      # The runner's AWS CLI creates the bucket and its CORS rules (same script as dev).
      - name: Create the S3 bucket
        env:
          ENDPOINT: http://localhost:9010
          BUCKET: flolist
          CORS_ORIGINS: http://localhost:5174
          AWS_ACCESS_KEY_ID: flolist
          AWS_SECRET_ACCESS_KEY: flolist-dev-secret
          AWS_DEFAULT_REGION: us-east-1
        run: |
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:9010/health && break
            sleep 1
          done
          sh infra/scripts/rustfs-init.sh

      - run: pnpm test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
