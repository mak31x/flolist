# Local dev services. Start with `pnpm infra:up` (or `pnpm dev`, which runs it first).
# Credentials come from the root .env (copy .env.example). Images are multi-arch (amd64 + arm64).
name: flolist-dev

services:
  postgres:
    image: postgres:19.0-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flolist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flolist}
      POSTGRES_DB: ${POSTGRES_DB:-flolist}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible storage. MinIO no longer publishes images, so dev uses RustFS (see decisions.md).
  rustfs:
    image: rustfs/rustfs:1.0.6
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-flolist}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-flolist-dev-secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "${S3_PORT:-9010}:9000"
      - "${S3_CONSOLE_PORT:-9011}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: creates the dev bucket if it is missing, then exits.
  # Kept in a profile so `up --wait` ignores it; `pnpm infra:up` runs it explicitly.
  rustfs-init:
    image: amazon/aws-cli:2.42.3
    profiles: ["init"]
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-flolist}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-flolist-dev-secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      BUCKET: ${S3_BUCKET:-flolist}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null
        || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$BUCKET"

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "${SMTP_PORT:-1026}:1025"
      - "${MAILPIT_UI_PORT:-8026}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  rustfs-data:
